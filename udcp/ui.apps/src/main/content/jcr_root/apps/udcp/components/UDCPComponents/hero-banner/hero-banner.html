
<section class="udcp-hero" data-sly-test="${properties.headline}" aria-labelledby="udcp-hero-title">
    <img class="udcp-hero__image"
         data-sly-test="${properties.bannerImage}"
         src="${properties.bannerImage @ context='uri'}"
         alt=""
         aria-hidden="true"
         fetchpriority="high">

    <div class="udcp-hero__content">
        <p class="udcp-eyebrow">UDCP University</p>
        <h1 class="udcp-hero__title" id="udcp-hero-title">${properties.headline}</h1>
        <p class="udcp-hero__description" data-sly-test="${properties.description}">
            ${properties.description}
        </p>
        <a class="udcp-button udcp-button--gold"
           data-sly-test="${properties.buttonText && properties.buttonLink}"
           href="${properties.buttonLink @ context='uri'}.html">
            ${properties.buttonText}
        </a>
    </div>
</section>
