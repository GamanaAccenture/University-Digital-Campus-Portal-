<sly data-sly-use.header="com.udcp.core.models.CampusHeader" />

<header class="campus-header" data-sly-test="${header}">

    <div class="campus-header__brand">
        <a href="/">
            <img
                data-sly-test="${header.logo}"
                class="campus-header__logo"
                src="${header.logo}"
                alt="UDCP University Logo" />
        </a>

        <span
            class="campus-header__wordmark"
            data-sly-test="${!header.logo}">
            UDCP University
        </span>
    </div>

    <input
        data-sly-test="${header.navigationLinks}"
        class="campus-header__menu-checkbox"
        type="checkbox"
        id="campus-header-menu-${resource.path}"
        aria-label="Toggle navigation menu"
        aria-controls="campus-header-navigation-${resource.path}" />

    <label
        data-sly-test="${header.navigationLinks}"
        class="campus-header__menu-button"
        for="campus-header-menu-${resource.path}">
        <span aria-hidden="true"></span>
    </label>

    <nav class="campus-header__navigation"
         id="campus-header-navigation-${resource.path}"
         data-sly-test="${header.navigationLinks}">

        <ul data-sly-list.link="${header.navigationLinks}">

            <li>
                <a
                    data-sly-test="${link.linkText && link.linkURL}"
                    href="${link.linkURL}.html">
                    ${link.linkText}
                </a>
            </li>

        </ul>

    </nav>

    <a
        data-sly-test="${header.applyButtonText && header.applyButtonLink}"
        class="campus-header__apply-button"
        href="${header.applyButtonLink}.html">

        ${header.applyButtonText}

    </a>

</header>
